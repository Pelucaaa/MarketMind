// ── AUTH ─────────────────────────────────────────────
let authMode='login';
function switchAuthTab(m){
  authMode=m;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(m==='login'&&i===0)||(m==='register'&&i===1)));
  document.getElementById('auth-btn').textContent=m==='login'?'Entrar':'Crear cuenta';
  document.getElementById('auth-error').style.display='none';
}
async function handleAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pwd=document.getElementById('auth-password').value;
  if(!email||!pwd){showAuthError('Completa email y contraseña');return;}
  const btn=document.getElementById('auth-btn');btn.textContent='Cargando...';btn.disabled=true;
  try{
    const res=authMode==='login'?await sb.auth.signInWithPassword({email,password:pwd}):await sb.auth.signUp({email,password:pwd});
    if(res.error)throw res.error;
  }catch(e){
    const msgs={'Invalid login credentials':'Email o contraseña incorrectos','User already registered':'Email ya registrado','Password should be at least 6 characters':'Mínimo 6 caracteres','Email not confirmed':'Confirma tu email'};
    showAuthError(msgs[e.message]||e.message);
    btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Crear cuenta';
  }
}
function showAuthError(msg){const el=document.getElementById('auth-error');el.textContent=msg;el.style.display='block';}
async function handleLogout(){
  try{await sb.auth.signOut();}catch(e){}
  S={user:null,trades:[],checklist:[...DEFAULT_CL],weeklyPlan:null,apiKey:localStorage.getItem('mm_key')||'',equityChart:null,currentPage:'dashboard',habits:[],habitLogs:{},diaryEntries:[],monthlyGoal:null,premarket:{},setupChart:null,periodChart:null};
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('auth-email').value='';
  document.getElementById('auth-password').value='';
  document.getElementById('auth-error').style.display='none';
  document.getElementById('auth-btn').textContent='Entrar';
  document.getElementById('auth-btn').disabled=false;
  switchAuthTab('login');
}
sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_OUT'||!session){document.getElementById('app').style.display='none';document.getElementById('auth-screen').style.display='flex';return;}
  if(session?.user){
    S.user=session.user;S.apiKey=localStorage.getItem('mm_key')||'';
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('user-avatar').textContent=session.user.email[0].toUpperCase();
    document.getElementById('user-email-display').textContent=session.user.email.split('@')[0];
    await loadUserData();
    showPage('dashboard');
    checkRiskAlerts();
  }
});

// ── LOAD DATA ────────────────────────────────────────
async function loadUserData(){
  document.getElementById('main-content').innerHTML='<div class="loading"><div class="spinner"></div> Cargando tus datos...</div>';
  try{
    const {data:trades,error}=await sb.from('trades').select('*').eq('user_id',S.user.id).order('created_at',{ascending:true});
    if(error)throw error;
    S.trades=(trades||[]).map(t=>({...t,result:parseFloat(t.result),checklist:t.checklist||{},errors:t.errors||[],feedback:t.feedback||null,screenshot_url:t.screenshot_url||null}));
  }catch(e){console.error(e);S.trades=[];}
  try{const {data:cfg}=await sb.from('checklist_config').select('items').eq('user_id',S.user.id).maybeSingle();if(cfg?.items?.length)S.checklist=cfg.items;}catch(e){}
  try{const {data:plans}=await sb.from('weekly_plans').select('plan').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(1);if(plans?.length)S.weeklyPlan=plans[0].plan;}catch(e){}
  try{const {data:h}=await sb.from('habits').select('*').eq('user_id',S.user.id).order('created_at',{ascending:true});S.habits=h||[];}catch(e){S.habits=[];}
  try{
    const from=new Date(Date.now()-90*86400000).toISOString().split('T')[0];
    const {data:logs}=await sb.from('habit_logs').select('*').eq('user_id',S.user.id).gte('log_date',from);
    S.habitLogs={};(logs||[]).forEach(l=>{S.habitLogs[`${l.habit_id}_${l.log_date}`]=true;});
  }catch(e){S.habitLogs={};}
  try{
    const from=new Date(Date.now()-90*86400000).toISOString().split('T')[0];
    const {data:d}=await sb.from('diary_entries').select('*').eq('user_id',S.user.id).gte('entry_date',from).order('entry_date',{ascending:false});
    S.diaryEntries=d||[];
  }catch(e){S.diaryEntries=[];}
  try{
    const month=new Date().toISOString().slice(0,7);
    const {data:g}=await sb.from('monthly_goals').select('*').eq('user_id',S.user.id).eq('month',month).maybeSingle();
    S.monthlyGoal=g||null;
  }catch(e){S.monthlyGoal=null;}
  try{
    const today=new Date().toISOString().split('T')[0];
    const {data:pm}=await sb.from('premarket').select('*').eq('user_id',S.user.id).eq('entry_date',today).maybeSingle();
    S.premarket=pm||{};
  }catch(e){S.premarket={};}
}

// ── SUPABASE HELPERS ─────────────────────────────────
async function saveTrade(t){
  const row={user_id:S.user.id,pair:t.pair,direction:t.direction,result:t.result,rr:t.result,setup:t.setup,session:t.session,timeframe:t.timeframe,emotion:t.emotion,confidence:t.confidence,stress:t.stress,notes:t.notes||'',checklist:t.checklist||{},score:null,errors:[],feedback:null,duration_minutes:t.duration_minutes||null};
  if(t.screenshot_url!==undefined)row.screenshot_url=t.screenshot_url;
  try{
    const {data,error}=await sb.from('trades').insert(row).select().single();
    if(error){
      if(error.message&&(error.message.includes('screenshot_url')||error.message.includes('duration_minutes'))){
        delete row.screenshot_url;delete row.duration_minutes;
        const {data:d2,error:e2}=await sb.from('trades').insert(row).select().single();
        if(e2)throw e2;return d2;
      }
      throw error;
    }
    return data;
  }catch(e){console.error(e);showToast('Error: '+e.message,'warn');return null;}
}

// ── RISK ALERTS ──────────────────────────────────────
function checkRiskAlerts(){
  const today=new Date().toISOString().split('T')[0];
  const todayTrades=S.trades.filter(t=>t.created_at?.slice(0,10)===today);
  const todayPnl=todayTrades.reduce((a,b)=>a+b.result,0);
  const recent3=S.trades.slice(-3);
  const banner=document.getElementById('risk-banner');
  const msg=document.getElementById('risk-banner-msg');
  if(todayPnl<=-2){
    msg.textContent=`⚠️ Llevas ${todayPnl.toFixed(1)}R hoy. Has alcanzado tu límite diario. Considera parar de operar.`;
    banner.style.display='flex';
  } else if(recent3.length===3&&recent3.every(t=>t.result<0)){
    msg.textContent=`⚠️ Llevas 3 pérdidas consecutivas. Tómate un descanso antes de continuar.`;
    banner.style.display='flex';
  } else {
    banner.style.display='none';
  }
}

// ── STATS ────────────────────────────────────────────
function calcStats(trades){
  const t=trades||S.trades;
  if(!t.length)return{pnl:0,wr:0,rr:0,weekPnl:0,winStreak:0,loseStreak:0,bestSetup:'-',bestSession:'-',count:0,maxDrawdown:0,disciplineStreak:0};
  const wins=t.filter(x=>x.result>0);
  const total=t.reduce((a,b)=>a+b.result,0);
  const wr=Math.round(wins.length/t.length*100);
  const rr=+(total/t.length).toFixed(2);
  const wStart=new Date(Date.now()-7*86400000);
  const weekPnl=t.filter(x=>new Date(x.created_at)>=wStart).reduce((a,b)=>a+b.result,0);
  let ws=0,ls=0,cW=0,cL=0;
  for(let i=t.length-1;i>=0;i--){if(t[i].result>0){cW++;cL=0}else{cL++;cW=0}if(cW>ws)ws=cW;if(cL>ls)ls=cL;}
  const sm={};t.forEach(x=>{sm[x.setup]=(sm[x.setup]||[]);sm[x.setup].push(x.result)});
  let bS='-',bSR=-999;Object.entries(sm).forEach(([k,v])=>{const a=v.reduce((a,b)=>a+b,0)/v.length;if(a>bSR){bSR=a;bS=k}});
  const se={};t.forEach(x=>{se[x.session]=(se[x.session]||[]);se[x.session].push(x.result)});
  let bSe='-',bSeR=-999;Object.entries(se).forEach(([k,v])=>{const a=v.reduce((a,b)=>a+b,0)/v.length;if(a>bSeR){bSeR=a;bSe=k}});
  // Drawdown
  let peak=0,maxDD=0,cum=0;
  [...t].sort((a,b)=>a.created_at>b.created_at?1:-1).forEach(x=>{cum+=x.result;if(cum>peak)peak=cum;const dd=peak-cum;if(dd>maxDD)maxDD=dd;});
  // Discipline streak
  const sorted=[...t].sort((a,b)=>a.created_at>b.created_at?1:-1);
  let ds=0;
  const dayMap={};
  sorted.forEach(x=>{const d=x.created_at?.slice(0,10);if(!d)return;const cc=Object.values(x.checklist||{}).filter(v=>v).length;const tc=Object.values(x.checklist||{}).length;const pct=tc>0?cc/tc:0;if(!dayMap[d])dayMap[d]=[];dayMap[d].push(pct);});
  const days=Object.keys(dayMap).sort().reverse();
  for(let i=0;i<days.length;i++){const avg=dayMap[days[i]].reduce((a,b)=>a+b,0)/dayMap[days[i]].length;if(avg>=0.8)ds++;else break;}
  return{pnl:+total.toFixed(2),wr,rr,weekPnl:+weekPnl.toFixed(2),winStreak:ws,loseStreak:ls,bestSetup:bS,bestSession:bSe,count:t.length,maxDrawdown:+maxDD.toFixed(2),disciplineStreak:ds};
}

function calcThermometer(){
  const s=calcStats();
  if(!S.trades.length)return 5;
  let score=0;
  // WR reciente (últimos 10 trades)
  const recent=S.trades.slice(-10);
  const recentWR=recent.filter(t=>t.result>0).length/recent.length;
  score+=recentWR*3; // 0-3
  // Disciplina (racha)
  score+=Math.min(s.disciplineStreak/7*2,2); // 0-2
  // Hábitos (últimos 7 días)
  const today=new Date().toISOString().split('T')[0];
  const days7=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000);days7.push(d.toISOString().split('T')[0]);}
  let habitScore=0;
  if(S.habits.length>0){
    const total=S.habits.length*7;
    const done=days7.reduce((acc,d)=>acc+S.habits.filter(h=>S.habitLogs[`${h.id}_${d}`]).length,0);
    habitScore=(done/total)*2;
  } else habitScore=1;
  score+=habitScore; // 0-2
  // Emoción media últimos trades
  const emotionAvg=recent.reduce((a,b)=>a+(b.emotion||5),0)/recent.length;
  score+=(emotionAvg/10)*2; // 0-2
  // Sin alertas de riesgo
  const todayTrades=S.trades.filter(t=>t.created_at?.slice(0,10)===today);
  const todayPnl=todayTrades.reduce((a,b)=>a+b.result,0);
  if(todayPnl>=-1)score+=1;
  return Math.max(1,Math.min(10,Math.round(score)));
}

function calcErrors(){const c={};ERROR_TYPES.forEach(e=>c[e]=0);S.trades.forEach(t=>(t.errors||[]).forEach(e=>{if(c[e]!==undefined)c[e]++}));return c;}

function calcPatterns(){
  const t=S.trades;if(t.length<3)return[];const p=[];
  const sm={};t.forEach(x=>{sm[x.session]=(sm[x.session]||[]);sm[x.session].push(x.result)});
  let wS=null,wA=999;Object.entries(sm).forEach(([k,v])=>{const a=v.reduce((a,b)=>a+b,0)/v.length;if(a<wA&&v.length>1){wA=a;wS=k}});
  if(wS&&wA<0)p.push({type:'danger',text:`Sesión más débil: ${wS} con ${wA.toFixed(1)}R de media`});
  const sp={};t.forEach(x=>{sp[x.setup]=(sp[x.setup]||[]);sp[x.setup].push(x.result)});
  let bS=null,bA=-999;Object.entries(sp).forEach(([k,v])=>{const a=v.reduce((a,b)=>a+b,0)/v.length;if(a>bA&&v.length>1){bA=a;bS=k}});
  if(bS)p.push({type:'green',text:`Setup más rentable: "${bS}" con +${bA.toFixed(1)}R`});
  const nc=t.filter(x=>Object.values(x.checklist||{}).filter(v=>!v).length>3);
  if(nc.length>1){const wr=nc.filter(x=>x.result>0).length/nc.length;if(wr<0.4)p.push({type:'danger',text:`Pierdes dinero sin checklist (${Math.round(wr*100)}% WR)`});}
  for(let i=1;i<t.length;i++){if(t[i-1].result<0&&(t[i].errors||[]).includes('Revenge Trading')){p.push({type:'warn',text:'Haces revenge trading después de pérdidas'});break;}}
  const le=t.filter(x=>x.emotion<=4);
  if(le.length>1){const a=le.reduce((a,b)=>a+b.result,0)/le.length;if(a<0)p.push({type:'warn',text:`Emoción baja (≤4) → PnL medio ${a.toFixed(1)}R`});}
  return p;
}

// ── EQUITY ───────────────────────────────────────────
function drawEquity(id){
  const canvas=document.getElementById(id);if(!canvas)return;
  if(S.equityChart){S.equityChart.destroy();S.equityChart=null;}
  const t=[...S.trades].sort((a,b)=>a.created_at>b.created_at?1:-1);
  let cum=0,peak=0;const labels=[],data=[],ddData=[];
  t.forEach(x=>{cum+=x.result;if(cum>peak)peak=cum;labels.push(x.created_at?.slice(5,10)||'');data.push(+cum.toFixed(2));ddData.push(+(peak-cum).toFixed(2));});
  if(!labels.length){labels.push('Inicio');data.push(0);ddData.push(0);}
  const pos=data[data.length-1]>=0;const color=pos?'#34d399':'#f87171';

// ── AI ───────────────────────────────────────────────
async function analyzeTradeWithAI(trade){
  const cc=Object.values(trade.checklist||{}).filter(v=>v).length;
  const tc=Object.values(trade.checklist||{}).length;
  const pct=tc>0?Math.round(cc/tc*100):0;
  let ai;
  try{
    if(!S.apiKey){ai=localAI(trade,pct);}
    else{
      const prompt=`Coach trading profesional. Analiza este trade. SOLO JSON sin markdown.\nTrade: Par=${trade.pair},Dir=${trade.direction},R=${trade.result},Setup=${trade.setup},Sesión=${trade.session},TF=${trade.timeframe},Emoción=${trade.emotion}/10,Confianza=${trade.confidence}/10,Estrés=${trade.stress}/10,Checklist=${pct}%,Duración=${trade.duration_minutes||'?'}min,Notas="${trade.notes||'ninguna'}"\nJSON español: {"score":0-100,"lo_que_hiciste_bien":["p1","p2"],"lo_que_hiciste_mal":["p1","p2"],"errores_detectados":[],"recomendacion":"frase","resumen":"2-3 frases"}`;
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
      const d=await res.json();ai=JSON.parse(d.content[0].text.replace(/```json|```/g,'').trim());
    }
  }catch(e){ai=localAI(trade,pct);}
  const idx=S.trades.findIndex(t=>t.id===trade.id);
  if(idx>=0){S.trades[idx].score=ai.score;S.trades[idx].errors=ai.errores_detectados||[];S.trades[idx].feedback=ai;}
  await updateTradeAI(trade.id,ai.score,ai.errores_detectados||[],ai);
  showToast(`Análisis: ${ai.score}/100`,'success');
}
function localAI(trade,pct){
  const w=trade.result>0;const g=pct>=70;let s=50;
  if(w)s+=20;if(g)s+=15;if(trade.emotion>=7)s+=10;if(trade.stress<=4)s+=5;
  if(!g)s-=20;if(trade.emotion<=4)s-=15;if(trade.stress>=8)s-=10;
  s=Math.max(5,Math.min(99,s));
  const errors=[];if(trade.emotion<=4&&!w)errors.push('Revenge Trading');if(trade.stress>=8)errors.push('FOMO');if(!g)errors.push('Sin Checklist');if(trade.session==='Asia'&&!w)errors.push('Ignorar HTF');
  return{score:s,lo_que_hiciste_bien:w?[g?'Seguiste la checklist':'Buena dirección','Setup identificado']:['Registraste el trade','Setup identificado'],lo_que_hiciste_mal:!g?['Checklist incompleta']:w?[]:['Entrada mal sincronizada'],errores_detectados:errors,recomendacion:g&&w?'Sigue el proceso.':'Completa siempre la checklist.',resumen:w?`Trade ganador +${trade.result}R. Checklist ${pct}%.`:`Trade perdedor ${trade.result}R. Revisa entrada.`};
}

function renderPeriodChart(mode){
  document.querySelectorAll('[id^="period-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('period-'+mode)?.classList.add('active');
  const canvas=document.getElementById('period-chart');if(!canvas)return;
  if(S.periodChart){S.periodChart.destroy();S.periodChart=null;}
  const grouped={};
  S.trades.forEach(t=>{
    const d=new Date(t.created_at);
    let key;
    if(mode==='week'){const wStart=new Date(d);wStart.setDate(d.getDate()-d.getDay()+1);key=wStart.toISOString().slice(0,10);}
    else{key=t.created_at?.slice(0,7);}
    if(!grouped[key])grouped[key]={pnl:0,count:0,wins:0};
    grouped[key].pnl+=t.result;grouped[key].count++;if(t.result>0)grouped[key].wins++;
  });
  const labels=Object.keys(grouped).sort().slice(-8);
  const pnlData=labels.map(k=>+grouped[k].pnl.toFixed(2));
  const colors=pnlData.map(v=>v>=0?'rgba(52,211,153,0.7)':'rgba(248,113,113,0.7)');
  S.periodChart=new Chart(canvas,{type:'bar',data:{labels,datasets:[{label:'PnL',data:pnlData,backgroundColor:colors,borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw}R`},backgroundColor:'#222228',bodyColor:'#f0eff4',borderColor:'#35353f',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5c72',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5c72',font:{size:10},callback:v=>v+'R'}}}}});
}

function renderSetupChart(){
  const canvas=document.getElementById('setup-chart');if(!canvas)return;
  if(S.setupChart){S.setupChart.destroy();S.setupChart=null;}
  const sm={};S.trades.forEach(t=>{if(!sm[t.setup])sm[t.setup]={pnl:0,count:0,wins:0};sm[t.setup].pnl+=t.result;sm[t.setup].count++;if(t.result>0)sm[t.setup].wins++;});
  const entries=Object.entries(sm).filter(([,v])=>v.count>=2).sort((a,b)=>b[1].pnl-a[1].pnl).slice(0,6);
  if(!entries.length)return;
  const labels=entries.map(([k])=>k.substring(0,18));
  const data=entries.map(([,v])=>+(v.pnl/v.count).toFixed(2));
  const colors=data.map(v=>v>=0?'rgba(52,211,153,0.7)':'rgba(248,113,113,0.7)');
  S.setupChart=new Chart(canvas,{type:'bar',data:{labels,datasets:[{label:'Avg R',data,backgroundColor:colors,borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw}R avg`},backgroundColor:'#222228',bodyColor:'#f0eff4',borderColor:'#35353f',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5c72',font:{size:10},callback:v=>v+'R'}},y:{grid:{display:false},ticks:{color:'#a09db8',font:{size:11}}}}}});
}

function renderSessionAnalysis(){
  const sm={};S.trades.forEach(t=>{if(!sm[t.session])sm[t.session]={trades:[],pnl:0};sm[t.session].trades.push(t);sm[t.session].pnl+=t.result;});
  if(!Object.keys(sm).length)return'<div class="empty" style="padding:16px 0"><div class="empty-sub">Sin datos</div></div>';
  return Object.entries(sm).map(([k,v])=>{
    const wr=Math.round(v.trades.filter(t=>t.result>0).length/v.trades.length*100);
    const avgR=(v.pnl/v.trades.length).toFixed(1);
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><div><div style="font-weight:500;font-size:13px">${k}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${v.trades.length} trades</div></div><div style="display:flex;gap:20px;text-align:right"><div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">WR</div><div class="${wr>=50?'pos':'neg'}" style="font-weight:600;font-family:'Geist Mono',monospace">${wr}%</div></div><div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Avg R</div><div class="${avgR>=0?'pos':'neg'}" style="font-weight:600;font-family:'Geist Mono',monospace">${avgR>=0?'+':''}${avgR}R</div></div></div></div>`;
  }).join('');
}
function renderEmotionAnalysis(){
  const b={high:[],mid:[],low:[]};
  S.trades.forEach(t=>{if(t.emotion>=7)b.high.push(t.result);else if(t.emotion>=4)b.mid.push(t.result);else b.low.push(t.result);});
  const avg=a=>a.length?+(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):null;
  return`<div class="grid-3">${[{label:'Alto 7–10',arr:b.high,color:'var(--green)'},{label:'Medio 4–6',arr:b.mid,color:'var(--amber)'},{label:'Bajo 1–3',arr:b.low,color:'var(--red)'}].map(d=>`<div class="metric"><div class="metric-label">${d.label}</div><div class="metric-value" style="color:${d.color};font-size:20px">${avg(d.arr)!==null?(avg(d.arr)>=0?'+':'')+avg(d.arr)+'R':'—'}</div><div class="metric-sub">${d.arr.length} trades${d.arr.length?' · '+Math.round(d.arr.filter(r=>r>0).length/d.arr.length*100)+'% WR':''}</div></div>`).join('')}</div>`;
}

// ── HÁBITOS (CALENDARIO) ─────────────────────────────
let habitCalendarDate = new Date();

function getLast7Days(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000);days.push({date:d.toISOString().split('T')[0],label:i===0?'Hoy':i===1?'Ayer':d.toLocaleDateString('es-ES',{weekday:'short'})});}
  return days;
}
function calcStreak(h){
  let streak=0;const d=new Date();
  for(let i=0;i<365;i++){const key=`${h.id}_${d.toISOString().split('T')[0]}`;if(S.habitLogs[key])streak++;else if(i>0)break;d.setDate(d.getDate()-1);}
  return streak;
}
function getDayPct(date){
  if(!S.habits.length)return null;
  const done=S.habits.filter(h=>S.habitLogs[`${h.id}_${date}`]).length;
  return Math.round(done/S.habits.length*100);
}

function renderHabitCalendar(){
  const year=habitCalendarDate.getFullYear();
  const month=habitCalendarDate.getMonth();
  const monthName=habitCalendarDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date().toISOString().split('T')[0];
  const adjustedFirst=(firstDay===0?6:firstDay-1);
  let cells='';
  for(let i=0;i<adjustedFirst;i++)cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pct=S.habits.length?getDayPct(date):null;
    const isFuture=date>today;const isToday=date===today;
    const bg=isFuture?'transparent':pct===null?'var(--bg3)':pct===0?'var(--red-dim)':pct<50?'rgba(251,191,36,0.15)':pct<80?'var(--lila-dim)':'var(--green-dim)';
    const textColor=isFuture?'var(--text3)':pct===null?'var(--text3)':pct===0?'var(--red)':pct<50?'var(--amber)':pct<80?'var(--lila)':'var(--green)';
    cells+=`<div onclick="${!isFuture?`openDayDetail('${date}')`:'return'}" style="aspect-ratio:1;border-radius:6px;background:${bg};display:flex;align-items:center;justify-content:center;cursor:${isFuture?'default':'pointer'};border:${isToday?'1.5px solid var(--lila)':'1.5px solid transparent'};transition:all 0.15s;flex-direction:column;gap:1px" title="${date}${pct!==null?' — '+pct+'%':''}"
      onmouseover="${!isFuture?`this.style.borderColor='var(--border2)'`:''}" onmouseout="${!isFuture?`this.style.borderColor='${isToday?'var(--lila)':'transparent'}'`:''}">
      <div style="font-size:11px;font-weight:${isToday?'700':'400'};color:${textColor}">${d}</div>
      ${pct!==null&&!isFuture?`<div style="font-size:9px;color:${textColor};font-family:'Geist Mono',monospace">${pct}%</div>`:''}
    </div>`;
  }
  return`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="changeHabitMonth(-1)" class="btn btn-ghost btn-sm"><i class="ti ti-chevron-left"></i></button>
      <div style="font-size:13px;font-weight:600;letter-spacing:-0.01em;text-transform:capitalize">${monthName}</div>
      <button onclick="changeHabitMonth(1)" class="btn btn-ghost btn-sm"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px">
      ${['Lu','Ma','Mi','Ju','Vi','Sa','Do'].map(d=>`<div style="text-align:center;font-size:10px;color:var(--text3);font-weight:500;padding:2px 0">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${[{color:'var(--green-dim)',text:'≥80%'},{color:'var(--lila-dim)',text:'50-79%'},{color:'rgba(251,191,36,0.15)',text:'1-49%'},{color:'var(--red-dim)',text:'0%'}].map(l=>`<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:${l.color}"></div><span style="font-size:10px;color:var(--text3)">${l.text}</span></div>`).join('')}
    </div>
  </div>`;
}

function changeHabitMonth(dir){
  habitCalendarDate=new Date(habitCalendarDate.getFullYear(),habitCalendarDate.getMonth()+dir,1);
  document.getElementById('habit-calendar-col').innerHTML=renderHabitCalendar();
}

function openDayDetail(date){
  if(!S.habits.length)return;
  const done=S.habits.filter(h=>S.habitLogs[`${h.id}_${date}`]);
  const pending=S.habits.filter(h=>!S.habitLogs[`${h.id}_${date}`]);
  const pct=getDayPct(date);
  const dayTrades=S.trades.filter(t=>t.created_at?.slice(0,10)===date);
  const dayPnl=dayTrades.reduce((a,b)=>a+b.result,0);
  const m=document.createElement('div');m.className='modal-overlay';m.id='day-modal';
  m.innerHTML=`<div class="modal" style="max-width:420px">
    <div class="modal-title"><i class="ti ti-calendar" style="color:var(--lila)"></i> ${new Date(date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <div class="metric" style="flex:1;padding:12px"><div class="metric-label">Hábitos</div><div class="metric-value" style="font-size:24px;color:${pct>=80?'var(--green)':pct>=50?'var(--lila)':'var(--red)'}">${pct}%</div><div class="metric-sub">${done.length}/${S.habits.length}</div></div>
      ${dayTrades.length?`<div class="metric" style="flex:1;padding:12px"><div class="metric-label">Trading</div><div class="metric-value ${dayPnl>=0?'pos':'neg'}" style="font-size:24px">${dayPnl>=0?'+':''}${dayPnl.toFixed(1)}R</div><div class="metric-sub">${dayTrades.length} trades</div></div>`:''}
    </div>
    ${done.length?`<div style="margin-bottom:12px"><div style="font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:8px">✓ Completados</div>${done.map(h=>`<div style="font-size:13px;color:var(--text);padding:4px 0;display:flex;align-items:center;gap:8px"><i class="ti ti-check" style="color:var(--green);font-size:14px"></i>${h.name}</div>`).join('')}</div>`:''}
    ${pending.length?`<div><div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:8px">✗ No completados</div>${pending.map(h=>`<div style="font-size:13px;color:var(--text2);padding:4px 0;display:flex;align-items:center;gap:8px"><i class="ti ti-x" style="color:var(--text3);font-size:14px"></i>${h.name}</div>`).join('')}</div>`:''}
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal('day-modal')">Cerrar</button></div>
  </div>`;
  document.body.appendChild(m);
}

function openAddHabit(){
  const m=document.createElement('div');m.className='modal-overlay';m.id='habit-modal';
  m.innerHTML=`<div class="modal" style="max-width:420px">
    <div class="modal-title"><i class="ti ti-leaf" style="color:var(--lila)"></i> Nuevo Hábito</div>
    <div class="form-group"><label class="form-label">Nombre</label><input type="text" class="form-input" id="h-name" placeholder="ej: Meditación, Ejercicio, Lectura..."></div>
    <div class="form-group"><label class="form-label">Categoría</label><select class="form-input" id="h-cat">${HABIT_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Nota (opcional)</label><input type="text" class="form-input" id="h-note" placeholder="Descripción breve"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('habit-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitHabit()"><i class="ti ti-check"></i> Añadir</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  setTimeout(()=>{const el=document.getElementById('h-name');if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')submitHabit();});}},50);

async function submitHabit(){
  const name=document.getElementById('h-name').value.trim();
  if(!name){showToast('Escribe el nombre','warn');return;}
  const cat=document.getElementById('h-cat').value;const note=document.getElementById('h-note').value;
  try{
    const {data,error}=await sb.from('habits').insert({user_id:S.user.id,name,category:cat,note}).select().single();
    if(error)throw error;S.habits.push(data);closeModal('habit-modal');showPage('habitos');showToast('Hábito añadido','success');
  }catch(e){showToast('Error: '+e.message,'warn');}
}
async function toggleHabitLog(habitId,date){
  const k=`${habitId}_${date}`;const done=!S.habitLogs[k];S.habitLogs[k]=done;
  try{
    if(done){await sb.from('habit_logs').upsert({user_id:S.user.id,habit_id:habitId,log_date:date,done:true},{onConflict:'user_id,habit_id,log_date'});}
    else{await sb.from('habit_logs').delete().eq('user_id',S.user.id).eq('habit_id',habitId).eq('log_date',date);}
  }catch(e){console.error(e);}
  document.getElementById('habit-table-col').innerHTML=renderHabitTable();
  document.getElementById('habit-calendar-col').innerHTML=renderHabitCalendar();
}
async function deleteHabit(id){
  if(!confirm('¿Eliminar este hábito y todo su historial?'))return;
  try{
    await sb.from('habit_logs').delete().eq('habit_id',id).eq('user_id',S.user.id);
    await sb.from('habits').delete().eq('id',id).eq('user_id',S.user.id);
    S.habits=S.habits.filter(h=>h.id!==id);Object.keys(S.habitLogs).filter(k=>k.startsWith(id+'_')).forEach(k=>delete S.habitLogs[k]);
    showPage('habitos');showToast('Hábito eliminado');
  }catch(e){showToast('Error','warn');}
}

function selectDiaryMood(v){
  window._diaryMood=v;

}

async function saveDiaryToday(){
  const today=new Date().toISOString().split('T')[0];
  const content=document.getElementById('diary-text').value;
  const mood=window._diaryMood||7;
  const saved=await saveDiaryEntry({entry_date:today,content,mood});
  if(saved){
    const idx=S.diaryEntries.findIndex(e=>e.entry_date===today);
    if(idx>=0)S.diaryEntries[idx]=saved;else S.diaryEntries.unshift(saved);
    showToast('Entrada guardada','success');
  }
}

async function submitPremarket(){

}

        <div style="font-size:13px;color:var(--text2);margin-top:4px">Actual: <span class="${monthPnl>=0?'pos':'neg'}" style="font-weight:600">${monthPnl>=0?'+':''}${monthPnl.toFixed(1)}R</span></div>
      </div>
      <div style="font-size:40px;font-weight:700;letter-spacing:-0.04em;color:${monthPnl>=S.monthlyGoal.target_r?'var(--green)':monthPnl>=0?'var(--lila)':'var(--red)'}">
        ${Math.min(100,Math.max(0,Math.round(monthPnl/S.monthlyGoal.target_r*100)))}%
      </div>
    </div>
    <div style="height:10px;background:var(--bg4);border-radius:5px;overflow:hidden;margin-bottom:12px">
      <div style="height:100%;width:${Math.min(100,Math.max(0,Math.round(monthPnl/S.monthlyGoal.target_r*100)))}%;background:${monthPnl>=S.monthlyGoal.target_r?'var(--green)':'var(--lila)'};border-radius:5px;transition:width 0.5s ease"></div>
    </div>
    <div style="font-size:12px;color:var(--text3)">Te quedan <strong style="color:var(--text)">${Math.max(0,(S.monthlyGoal.target_r-monthPnl)).toFixed(1)}R</strong> para alcanzar tu objetivo · ${monthTrades.length} trades este mes</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="openSetGoal()"><i class="ti ti-edit"></i> Cambiar objetivo</button>`:`
    <p style="font-size:13px;color:var(--text3);margin-bottom:14px">Define tu objetivo de R para este mes y haz seguimiento en tiempo real.</p>
    <button class="btn btn-primary" onclick="openSetGoal()"><i class="ti ti-target"></i> Establecer objetivo</button>`}
  </div>

  <!-- Racha de disciplina -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><span class="card-title">🔔 Racha de disciplina</span></div>
    <div style="display:flex;align-items:center;gap:20px">
      <div style="text-align:center">
        <div style="font-size:48px;font-weight:700;letter-spacing:-0.04em;color:${s.disciplineStreak>=7?'var(--green)':s.disciplineStreak>=3?'var(--lila)':'var(--text2)'};line-height:1">${s.disciplineStreak}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">días consecutivos</div>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--text);margin-bottom:8px">${s.disciplineStreak>=7?'🏆 Semana perfecta de disciplina':s.disciplineStreak>=3?'💪 Buena racha, sigue así':s.disciplineStreak>=1?'🌱 Empezando a construir hábito':'📈 Opera con checklist completa (≥80%) para comenzar tu racha'}</div>
        <div style="font-size:12px;color:var(--text3)">Días operando con checklist ≥ 80% completada de forma consecutiva</div>
        <div style="margin-top:10px;display:flex;gap:6px">
          ${[1,3,7,14,30].map(goal=>`<div style="text-align:center;padding:6px 10px;background:${s.disciplineStreak>=goal?'var(--lila-dim)':'var(--bg3)'};border:1px solid ${s.disciplineStreak>=goal?'var(--lila)':'var(--border)'};border-radius:var(--radius)"><div style="font-size:13px;font-weight:600;color:${s.disciplineStreak>=goal?'var(--lila)':'var(--text3)'}">${goal}d</div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- Badges / Logros -->
  <div class="card">
    <div class="card-header"><span class="card-title">🏆 Logros</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
      ${badges.map(b=>`<div style="background:${b.earned?'var(--lila-dim)':'var(--bg3)'};border:1px solid ${b.earned?'rgba(167,139,250,0.3)':'var(--border)'};border-radius:var(--radius-lg);padding:14px;text-align:center;opacity:${b.earned?'1':'0.5'}">
        <div style="font-size:28px;margin-bottom:8px">${b.emoji}</div>
        <div style="font-size:12px;font-weight:600;color:${b.earned?'var(--text)':'var(--text3)'};margin-bottom:4px">${b.name}</div>
        <div style="font-size:11px;color:var(--text3);line-height:1.4">${b.desc}</div>
        ${b.earned?'<div style="font-size:10px;color:var(--lila);margin-top:6px;font-weight:600">✓ Desbloqueado</div>':''}
      </div>`).join('')}
    </div>
  </div>`;
}

function calcBadges(){
  const s=calcStats();
  const today=new Date().toISOString().split('T')[0];
  const monthTrades=S.trades.filter(t=>t.created_at?.slice(0,7)===new Date().toISOString().slice(0,7));
  return[
    {emoji:'📝',name:'Primer trade',desc:'Registra tu primer trade',earned:S.trades.length>=1},
    {emoji:'🔟',name:'10 trades',desc:'Registra 10 trades',earned:S.trades.length>=10},
    {emoji:'💯',name:'100 trades',desc:'Registra 100 trades',earned:S.trades.length>=100},
    {emoji:'✅',name:'Disciplinado',desc:'3 días consecutivos con checklist ≥80%',earned:s.disciplineStreak>=3},
    {emoji:'🔥',name:'Racha semanal',desc:'7 días seguidos con checklist completa',earned:s.disciplineStreak>=7},
    {emoji:'🏆',name:'Mes perfecto',desc:'30 días de disciplina seguidos',earned:s.disciplineStreak>=30},
    {emoji:'📈',name:'Rentable',desc:'WR superior al 50%',earned:s.wr>=50},
    {emoji:'💎',name:'Elite',desc:'WR superior al 65%',earned:s.wr>=65},
    {emoji:'🧘',name:'Sin revenge',desc:'Sin errores de revenge trading',earned:!S.trades.some(t=>(t.errors||[]).includes('Revenge Trading'))},
    {emoji:'🌱',name:'Hábitos iniciados',desc:'Al menos 3 hábitos activos',earned:S.habits.length>=3},
    {emoji:'🗓️',name:'Mes activo',desc:'15+ trades en un mes',earned:monthTrades.length>=15},
    {emoji:'⚡',name:'RR positivo',desc:'RR medio por encima de 1.5R',earned:s.rr>=1.5},
  ];
}

function openSetGoal(){
  const month=new Date().toISOString().slice(0,7);
  const m=document.createElement('div');m.className='modal-overlay';m.id='goal-modal';
  m.innerHTML=`<div class="modal" style="max-width:400px">
    <div class="modal-title"><i class="ti ti-target" style="color:var(--lila)"></i> Objetivo mensual</div>
    <div class="form-group"><label class="form-label">Objetivo de R para este mes</label><input type="number" step="0.5" class="form-input" id="goal-r" placeholder="ej: 10" value="${S.monthlyGoal?.target_r||''}"></div>
    <div class="form-group"><label class="form-label">Notas (opcional)</label><textarea class="form-input" id="goal-notes" placeholder="Estrategia, condiciones...">${S.monthlyGoal?.notes||''}</textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('goal-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitGoal()"><i class="ti ti-check"></i> Guardar</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  setTimeout(()=>document.getElementById('goal-r').focus(),50);
}
async function submitGoal(){
  const r=parseFloat(document.getElementById('goal-r').value);
  if(isNaN(r)||r<=0){showToast('Introduce un objetivo válido','warn');return;}
  const month=new Date().toISOString().slice(0,7);
  await saveMonthlyGoal({month,target_r:r,notes:document.getElementById('goal-notes').value});
  closeModal('goal-modal');showPage('objetivos');showToast('Objetivo guardado','success');
}

// ── CONFIG ───────────────────────────────────────────
function renderConfig(){
  document.getElementById('main-content').innerHTML=`
  <div class="section-header"><div><h1>Configuración</h1><p class="page-sub">Personaliza tu experiencia</p></div></div>
  <div class="grid-2">
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><span class="card-title">API Key Anthropic (opcional)</span></div>
        <p style="font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.7">Sin API key la IA funciona en modo local. Con tu clave obtendrás análisis más precisos.</p>
        <div class="form-group"><input type="password" class="form-input" id="api-key-input" placeholder="sk-ant-..." value="${S.apiKey}"></div>
        <button class="btn btn-primary btn-sm" onclick="saveApiKey()"><i class="ti ti-check"></i> Guardar clave</button>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Exportar datos</span></div>
        <button class="btn btn-ghost btn-sm" onclick="exportData()"><i class="ti ti-download"></i> Descargar JSON</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Checklist de trading</span><button class="btn btn-ghost btn-sm" onclick="addCheckItem()"><i class="ti ti-plus"></i> Añadir</button></div>
      <p style="font-size:12px;color:var(--text3);margin-bottom:12px">Aparece al registrar cada trade.</p>
      <div id="cl-config">${renderCLConfig()}</div>
    </div>
  </div>`;
}
function renderCLConfig(){return S.checklist.map(c=>`<div class="check-item"><div class="check-box ${c.active?'checked':''}" onclick="toggleCLItem(${c.id})">${c.active?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':''}</div><input type="text" value="${c.label}" onchange="updateCLLabel(${c.id},this.value)" style="flex:1;background:transparent;border:none;color:var(--text);font-family:'Geist','Inter',sans-serif;font-size:13px;outline:none"><button onclick="removeCLItem(${c.id})" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 4px;font-size:13px"><i class="ti ti-x"></i></button></div>`).join('');}
async function toggleCLItem(id){const c=S.checklist.find(x=>x.id===id);if(c)c.active=!c.active;await saveChecklistCfg();document.getElementById('cl-config').innerHTML=renderCLConfig();}
async function updateCLLabel(id,val){const c=S.checklist.find(x=>x.id===id);if(c)c.label=val;await saveChecklistCfg();}
async function addCheckItem(){S.checklist.push({id:Date.now(),label:'Nuevo check',active:true});await saveChecklistCfg();document.getElementById('cl-config').innerHTML=renderCLConfig();}
async function removeCLItem(id){S.checklist=S.checklist.filter(c=>c.id!==id);await saveChecklistCfg();document.getElementById('cl-config').innerHTML=renderCLConfig();}
function saveApiKey(){S.apiKey=document.getElementById('api-key-input').value.trim();localStorage.setItem('mm_key',S.apiKey);showToast('API Key guardada','success');}
function exportData(){const b=new Blob([JSON.stringify(S.trades,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='marketmind_trades.json';a.click();}

// ── UTILS ────────────────────────────────────────────
function closeModal(id){const m=document.getElementById(id);if(m)m.remove();}
function showToast(msg,type='info'){
  const t=document.getElementById('toast');t.textContent=msg;
  t.style.borderColor=type==='success'?'var(--green)':type==='warn'?'var(--amber)':'var(--border2)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}
document.getElementById('auth-password').addEventListener('keydown',e=>{if(e.key==='Enter')handleAuth();});
</script>
</body>
