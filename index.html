          html += '<div style="font-size:12px;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">' + (a.content || 'Sin descripción') + '</div>';
          html += '</div></div>';
        });
        html += '</div>';
      } else {
        html += '<div class="empty" style="margin-top:20px"><div class="empty-icon">📚</div><div class="empty-title">Sin apuntes todavía</div><div class="empty-sub">Crea tu primer apunte de patrones para tu biblioteca personal</div></div>';
      }
      container.innerHTML = html;
    }

    function filterApuntes() {
      const q = document.getElementById('apuntes-search').value.toLowerCase();
      document.querySelectorAll('.apunte-card').forEach(card => {
        const title = card.getAttribute('data-title').toLowerCase();
        if (title.includes(q)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    let selectedApunteImg = null;
    function openAddApunte(editId = null) {
      let a = null;
      if (editId) a = S.apuntes.find(x => x.id == editId);

      selectedApunteImg = null;
      const m = document.createElement('div'); m.className = 'modal-overlay'; m.id = 'apunte-modal';
      m.innerHTML = `<div class="modal">
        <div class="modal-title"><i class="ti ti-${editId ? 'edit' : 'book'}" style="color:var(--lila)"></i> ${editId ? 'Editar Apunte' : 'Nuevo Apunte'}</div>
        <div class="form-group"><label class="form-label">Título</label><input type="text" class="form-input" id="a-title" placeholder="Ej: Patrón hombro-cabeza-hombro" value="${a ? a.title : ''}"></div>
        <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-input" id="a-content" placeholder="¿Qué significa este patrón?">${a ? (a.content || '') : ''}</textarea></div>
        <div class="form-group">
          <label class="form-label">Imagen (Opcional)</label>
          <div id="apunte-img-preview" style="display:${a && a.image_url ? 'block' : 'none'};margin-bottom:8px;position:relative">
            <img id="apunte-img-el" src="${a && a.image_url ? a.image_url : ''}" style="width:100%;max-height:160px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)">
            <button onclick="removeApunteImage()" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center">✕</button>
          </div>
          <label class="upload-zone" id="apunte-upload-label" style="display:${a && a.image_url ? 'none' : 'flex'}"><i class="ti ti-photo"></i> Subir imagen<input type="file" accept="image/*" style="display:none" onchange="previewApunteImage(this)"></label>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
          <button class="btn btn-ghost" onclick="closeModal('apunte-modal')">Cancelar</button>
          <button class="btn btn-primary" id="save-apunte-btn" onclick="submitApunte(${editId ? `'${editId}'` : 'null'})"><i class="ti ti-check"></i> ${editId ? 'Actualizar' : 'Guardar Apunte'}</button>
        </div>
      </div>`;
      document.body.appendChild(m);
    }
    function previewApunteImage(input) {
      const file = input.files[0]; if (!file) return; selectedApunteImg = file;
      const r = new FileReader(); r.onload = e => { document.getElementById('apunte-img-el').src = e.target.result; document.getElementById('apunte-img-preview').style.display = 'block'; document.getElementById('apunte-upload-label').style.display = 'none'; }; r.readAsDataURL(file);
    }
    function removeApunteImage() { selectedApunteImg = null; document.getElementById('apunte-img-preview').style.display = 'none'; document.getElementById('apunte-upload-label').style.display = 'flex'; }
    async function submitApunte(editId = null) {
      const title = document.getElementById('a-title').value.trim();
      if (!title) { showToast('El título es obligatorio', 'warn'); return; }
      const content = document.getElementById('a-content').value.trim();
      const btn = document.getElementById('save-apunte-btn'); btn.innerHTML = '<div class="spinner"></div> Guardando...'; btn.disabled = true;
      let url = null;
      let existingApunte = null;

      if (editId) {
        existingApunte = S.apuntes.find(x => x.id == editId);
        url = existingApunte?.image_url;
      }

      if (document.getElementById('apunte-img-preview').style.display === 'none') {
        url = null;
      }
      if (selectedApunteImg) { showToast('Subiendo imagen...'); url = await uploadScreenshot(selectedApunteImg); }
      
      try {
        let data, error;
        if (editId) {
          const res = await sb.from('apuntes').update({ title, content, image_url: url }).eq('id', editId).select().single();
          data = res.data; error = res.error;
        } else {
          const res = await sb.from('apuntes').insert({ user_id: S.user.id, title, content, image_url: url }).select().single();
          data = res.data; error = res.error;
        }
        if (error) throw error;
        
        if (editId) {
          const idx = S.apuntes.findIndex(x => x.id == editId);
          if (idx !== -1) S.apuntes[idx] = { ...S.apuntes[idx], title, content, image_url: url };
          showToast('Apunte actualizado');
        } else {
          S.apuntes.unshift(data);
          showToast('Apunte guardado');
        }
        closeModal('apunte-modal'); renderCuaderno();
      } catch (e) { showToast('Error al guardar apunte', 'warn'); btn.innerHTML = '<i class="ti ti-check"></i> ' + (editId ? 'Actualizar' : 'Guardar Apunte'); btn.disabled = false; }
    }
    function openApunteDetail(id) {
      const a = S.apuntes.find(x => x.id == id); if (!a) return;
      const m = document.createElement('div'); m.className = 'modal-overlay'; m.id = 'apunte-detail-modal';
      m.innerHTML = `<div class="modal" style="max-width: 1000px; width: 90%; padding: 32px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px">
          <div class="modal-title" style="margin-bottom:0; font-size: 22px;">${a.title}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="closeModal('apunte-detail-modal');openAddApunte('${id}')"><i class="ti ti-edit"></i> Editar</button>
            <button class="btn btn-danger btn-sm" onclick="closeModal('apunte-detail-modal');deleteApunte('${id}')"><i class="ti ti-trash"></i> Eliminar</button>
          </div>
        </div>

        <div style="color:var(--text);font-size:15px;line-height:1.7;white-space:pre-wrap">${a.content || 'Sin contenido'}</div>
        <div style="margin-top:24px;text-align:right"><button class="btn btn-ghost" onclick="closeModal('apunte-detail-modal')">Cerrar</button></div>
      </div>`;
      document.body.appendChild(m);
    }
    async function deleteApunte(id) {
      if (!confirm('¿Eliminar apunte?')) return;
      S.apuntes = S.apuntes.filter(x => x.id != id); renderCuaderno();
      try { await sb.from('apuntes').delete().eq('id', id).eq('user_id', S.user.id); } catch (e) { }
    }

    function refreshConfigContent() {
      const content = document.getElementById('config-content');
      if (content) content.innerHTML = renderConfigContent();
    }

    function renderConfig() {
      if (typeof S.configTab === 'undefined') S.configTab = 'general';
      document.getElementById('main-content').innerHTML = `
  <div class="section-header" style="max-width:820px; margin:0 auto 20px;">
    <div><h1>Configuración</h1><div class="page-sub">Personaliza tu experiencia en MarketMind.</div></div>
  </div>
  <div class="config-container" style="max-width:820px; margin:0 auto; display:flex; gap:24px; animation: fadeIn 0.3s ease;">
    <div class="config-sidebar" style="width:220px; flex-shrink:0;">
      <div style="background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:4px;">
        
        <div style="font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; padding:8px 12px 4px;">Ajustes de cuenta</div>
        <button class="config-nav-item ${S.configTab === 'general' ? 'active' : ''}" data-tab="general" onclick="setConfigTab('general')">
          <i class="ti ti-settings"></i> General
        </button>
        
        <div style="height:1px; background:var(--border); margin:8px 12px;"></div>
        
        <div style="font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; padding:8px 12px 4px;">Personalización</div>
        <button class="config-nav-item ${S.configTab === 'checklist' ? 'active' : ''}" data-tab="checklist" onclick="setConfigTab('checklist')">
          <i class="ti ti-list-check"></i> Checklist
        </button>
        <button class="config-nav-item ${S.configTab === 'pares' ? 'active' : ''}" data-tab="pares" onclick="setConfigTab('pares')">
          <i class="ti ti-coin"></i> Pares
        </button>
        <button class="config-nav-item ${S.configTab === 'setups' ? 'active' : ''}" data-tab="setups" onclick="setConfigTab('setups')">
          <i class="ti ti-chart-bar"></i> Setups
        </button>
        <button class="config-nav-item ${S.configTab === 'sesiones' ? 'active' : ''}" data-tab="sesiones" onclick="setConfigTab('sesiones')">
          <i class="ti ti-clock"></i> Sesiones
        </button>
        <button class="config-nav-item ${S.configTab === 'timeframes' ? 'active' : ''}" data-tab="timeframes" onclick="setConfigTab('timeframes')">
          <i class="ti ti-timeline"></i> Timeframes
        </button>
      </div>
    </div>
    
    <div class="config-content-wrapper" style="flex:1; min-width:0;">
      <div id="config-content" style="background:var(--bg2); border:1px solid rgba(167,139,250,0.15); box-shadow:0 0 15px rgba(167,139,250,0.04); border-radius:12px; padding:24px; transition:opacity 0.15s ease;">
        ${renderConfigContent()}
      </div>
    </div>
  </div>`;
    }

    function renderConfigContent() {
      if (S.configTab === 'general') {
        return `
          <h2 style="font-size:18px; font-weight:600; margin-bottom:4px; letter-spacing:-0.02em;">General</h2>
          <p style="font-size:13px; color:var(--text3); margin-bottom:24px;">Ajustes globales de tu cuenta y exportación de datos.</p>
          
          <div style="margin-bottom:24px;">
            <div style="font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px;">API Key Google Gemini</div>
            <p style="font-size:12px; color:var(--text2); margin-bottom:12px; line-height:1.5;">API Key gratuita de Google Gemini para usar la Inteligencia Artificial. Consíguela en aistudio.google.com sin tarjeta de crédito.</p>
            <div style="display:flex; gap:10px;">
              <input type="password" class="form-input" id="api-key-input" placeholder="AIza..." value="${S.apiKey}" style="max-width:300px;">
              <button class="btn btn-primary" onclick="saveApiKey()"><i class="ti ti-check"></i> Guardar</button>
            </div>
          </div>
          
          <div style="height:1px; background:var(--border); margin:24px 0;"></div>
          
          <div>
            <div style="font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px;">Exportar datos</div>
            <p style="font-size:12px; color:var(--text2); margin-bottom:12px; line-height:1.5;">Descarga un archivo JSON con todos tus trades, hábitos, apuntes y configuración para tener una copia de seguridad local.</p>
            <button class="btn btn-ghost btn-sm" onclick="exportData()"><i class="ti ti-download"></i> Descargar copia de seguridad</button>

      if (S.configTab === 'checklist') {
        return `
          <h2 style="font-size:18px; font-weight:600; margin-bottom:4px; letter-spacing:-0.02em;">Checklist de trading</h2>
          <p style="font-size:13px; color:var(--text3); margin-bottom:24px;">Reglas que debes cumplir antes de tomar un trade. Aparecerá en el formulario de registro.</p>

      }
      
      let title, desc, key, defaultList, ph;
      if (S.configTab === 'pares') { title = 'Pares'; desc = 'Pares de divisas, índices o activos que operas.'; key = 'customPairs'; defaultList = PAIRS; ph = 'Ej: AUDUSD'; }
      if (S.configTab === 'setups') { title = 'Setups'; desc = 'Tus modelos de entrada al mercado.'; key = 'customSetups'; defaultList = SETUPS; ph = 'Nuevo setup'; }
      if (S.configTab === 'sesiones') { title = 'Sesiones'; desc = 'Horarios operativos que utilizas.'; key = 'customSessions'; defaultList = SESSIONS; ph = 'Nueva sesión'; }
      if (S.configTab === 'timeframes') { title = 'Timeframes'; desc = 'Temporalidades en las que analizas o entras.'; key = 'customTimeframes'; defaultList = TIMEFRAMES; ph = 'Ej: H4'; }

      return `
        <h2 style="font-size:18px; font-weight:600; margin-bottom:4px; letter-spacing:-0.02em;">${title}</h2>

          <input type="text" id="new-${key}" placeholder="${ph}" onkeypress="if(event.key==='Enter') addCustomItemInput('${key}', 'new-${key}')">

        </div>

    }

    function renderCustomList(key, defaultList) {
      const list = S[key] && S[key].length ? S[key] : [...defaultList];
      return list.map((item, idx) => `
        <div class="check-item" draggable="true" ondragstart="handleDragStart(event, '${key}', ${idx})" ondragover="event.preventDefault()" ondrop="handleDrop(event, '${key}', ${idx})" ondragend="handleDragEnd(event)">
          <span style="cursor:grab;color:var(--text3);font-size:14px;margin-right:6px;user-select:none;display:flex;align-items:center">⠿</span>
          <input type="text" value="${item}" onchange="updateCustomItem('${key}', ${idx}, this.value)" style="flex:1;background:transparent;border:none;color:var(--text);font-family:'Geist','Inter',sans-serif;font-size:13px;outline:none">
          <button onclick="removeCustomItem('${key}', ${idx})" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 4px;font-size:13px"><i class="ti ti-x"></i></button>
        </div>
      `).join('');
    }

    let dragSrcIdx = null;
    let dragSrcKey = null;

    function handleDragStart(e, key, idx) {
      dragSrcIdx = idx;
      dragSrcKey = key;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', idx);
      e.target.style.opacity = '0.4';
    }

    function handleDragEnd(e) {
      e.target.style.opacity = '1';
    }

    async function handleDrop(e, key, idx) {
      e.preventDefault();
      if (dragSrcKey !== key || dragSrcIdx === idx) return;
      if (!S[key] || !S[key].length) {
         const defs = key === 'customPairs' ? PAIRS : key === 'customSetups' ? SETUPS : key === 'customSessions' ? SESSIONS : TIMEFRAMES;
         S[key] = [...defs];
      }
      const item = S[key].splice(dragSrcIdx, 1)[0];
      S[key].splice(idx, 0, item);
      await saveUserCfg();
      refreshConfigContent();
    }

    async function addCustomItemInput(key, inputId) {
      const val = document.getElementById(inputId).value.trim();
      if (!val) return;
      if (!S[key] || !S[key].length) S[key] = [...(key === 'customPairs' ? PAIRS : key === 'customSetups' ? SETUPS : key === 'customSessions' ? SESSIONS : TIMEFRAMES)];
      S[key].push(val);
      await saveUserCfg();
      refreshConfigContent();
    }

    async function removeCustomItem(key, idx) {
      if (!S[key] || !S[key].length) S[key] = [...(key === 'customPairs' ? PAIRS : key === 'customSetups' ? SETUPS : key === 'customSessions' ? SESSIONS : TIMEFRAMES)];
      S[key].splice(idx, 1);
      await saveUserCfg();
      refreshConfigContent();
    }

    async function updateCustomItem(key, idx, val) {
      if (!val.trim()) return;
      if (!S[key] || !S[key].length) S[key] = [...(key === 'customPairs' ? PAIRS : key === 'customSetups' ? SETUPS : key === 'customSessions' ? SESSIONS : TIMEFRAMES)];
      S[key][idx] = val.trim();
      await saveUserCfg();
    }

    function renderCLConfig() { return S.checklist.map(c => `<div class="check-item"><div class="check-box ${c.active ? 'checked' : ''}" onclick="toggleCLItem(${c.id})">${c.active ? '<i class="ti ti-check" style="font-size:11px;color:#fff"></i>' : ''}</div><input type="text" value="${c.label}" onchange="updateCLLabel(${c.id},this.value)" style="flex:1;background:transparent;border:none;color:var(--text);font-family:'Geist','Inter',sans-serif;font-size:13px;outline:none"><button onclick="removeCLItem(${c.id})" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 4px;font-size:13px"><i class="ti ti-x"></i></button></div>`).join(''); }
    async function toggleCLItem(id) { const c = S.checklist.find(x => x.id === id); if (c) c.active = !c.active; await saveChecklistCfg(); refreshConfigContent(); }

    async function addCheckItem() { S.checklist.push({ id: Date.now(), label: 'Nuevo check', active: true }); await saveChecklistCfg(); refreshConfigContent(); }
    async function removeCLItem(id) { S.checklist = S.checklist.filter(c => c.id !== id); await saveChecklistCfg(); refreshConfigContent(); }
    function saveApiKey() { S.apiKey = document.getElementById('api-key-input').value.trim(); localStorage.setItem('mm_key', S.apiKey); showToast('API Key guardada', 'success'); }
    function exportData() { const b = new Blob([JSON.stringify(S.trades, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'marketmind_trades.json'; a.click(); }

    // ── UTILS ────────────────────────────────────────────
    function closeModal(id) { const m = document.getElementById(id); if (m) m.remove(); }

    async function callGeminiAPI(prompt, isJson = false, timeoutMs = 15000) {
      if (!S.apiKey) throw new Error('API Key no configurada');
      const body = { contents: [{ parts: [{ text: prompt }] }] };
      const modelsToTry = ['gemini-1.5-pro', 'gemini-1.5-flash-8b', 'gemini-1.5-flash', 'gemini-pro'];
      let lastError = null;
      
      for (const model of modelsToTry) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.apiKey}`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(body),
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          const data = await res.json();
          if (data.error) {
            lastError = new Error(data.error.message);
            continue;
          }
          if (!data.candidates || data.candidates.length === 0) {
            lastError = new Error('La IA no devolvió respuesta');
            continue;
          }
          const candidate = data.candidates[0];
          if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
            const reason = candidate.finishReason || 'Desconocida';
            lastError = new Error('La IA bloqueó la respuesta (Razón: ' + reason + ')');
            continue;
          }
          let text = candidate.content.parts[0].text || '';
          if (isJson) {
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            const startIdx = text.indexOf('{');
            const endIdx = text.lastIndexOf('}');
            if (startIdx !== -1 && endIdx !== -1) {
              text = text.substring(startIdx, endIdx + 1);
            }
          }
          return text;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError;
    }
    function openLightbox(url) {
      const m = document.createElement('div');
      m.className = 'modal-overlay';
      m.id = 'lightbox-modal';
      m.style.zIndex = '9999';

      </div>`;
      m.onclick = function (e) { if (e.target === m) closeModal('lightbox-modal'); };
      document.body.appendChild(m);
    }
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast'); t.textContent = msg;
      t.style.borderColor = type === 'success' ? 'var(--green)' : type === 'warn' ? 'var(--amber)' : 'var(--border2)';
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500);
    }
    document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
